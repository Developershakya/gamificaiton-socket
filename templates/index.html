<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Game</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>
    <div id="join">
        <input id="username" placeholder="Your Name">
        <button onclick="generateCode()">Generate Code</button>
        <input id="joinCode" placeholder="Enter Room Code">
        <button onclick="joinRoom()">Join</button>
        <div id="generatedCode"></div>
    </div>

    <div id="waiting" style="display:none;">
        <h2>Waiting for second player...</h2>
    </div>

    <div id="quiz" style="display:none;">
        <h2 id="question"></h2>
        <h3>Question: <span id="question-count">1</span> / <span id="total-questions">0</span></h3>
        <h3>Your username: <span id="username-display"></span></h3>
        <div id="options"></div>
        <h3 id="timer">10</h3>
    </div>

    <script>
        const socket = io();
        let room = "";
        let username = "";
        let totalQuestions = 0;
        let currentQuestion = 0;

        function generateCode() {
            socket.emit('generate_code');
        }

        socket.on('code_generated', code => {
            room = code;
            document.getElementById('generatedCode').innerText = "Room Code: " + code;
        });

        function joinRoom() {
            username = document.getElementById('username').value;
            room = document.getElementById('joinCode').value || room;
            if (!username || !room) return alert("Enter username and room code");

            socket.emit('join_room', { username, code: room });
        }

        socket.on('waiting', () => {
            document.getElementById('join').style.display = 'none';
            document.getElementById('waiting').style.display = 'block';
        });

        socket.on('new_question', data => {
            document.getElementById('join').style.display = 'none';
            document.getElementById('waiting').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';

            totalQuestions = data.total;
            document.getElementById('total-questions').innerText = totalQuestions;

            document.getElementById('question').innerText = data.question;
            document.getElementById('question-count').innerText = data.index + 1;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            data.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => {
                    socket.emit('answer', {
                        username,
                        room,
                        answer: opt
                    });
                };
                optionsDiv.appendChild(btn);
            });

            document.getElementById('username-display').innerText = username;

            let countdown = 10;
            const timer = document.getElementById('timer');
            timer.innerText = countdown;

            const interval = setInterval(() => {
                countdown--;
                timer.innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(interval);
                    socket.emit('answer', {
                        username,
                        room,
                        answer: ""  // blank = timeout
                    });
                }
            }, 1000);
        });

        socket.on('quiz_end', () => {
            alert("Quiz over! Reloading.");
            location.reload();
        });

        socket.on('room_error', msg => alert(msg));
    </script>
</body>
</html>
